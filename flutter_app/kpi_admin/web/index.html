<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DSP CODRIVER — die Operations-Plattform für Amazon Delivery Service Provider. Scorecards, Driver Management, Fleet Hub, Waveplan, Kalender und Compliance an einem Ort. Mehrsprachig, rollenbasiert und in Echtzeit.">

  <!-- Open Graph (Link-Previews in Slack, WhatsApp, etc.) -->
  <meta property="og:title" content="DSP CODRIVER">
  <meta property="og:description" content="Operations-Plattform für DSPs: Scorecards, Driver, Fleet, Waveplan, Kalender und Compliance — alles an einem Ort.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DSP CODRIVER — Operations-Plattform für DSPs</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Seitenhülle: Die App füllt IMMER die sichtbare Fläche.
       Ohne das blieb auf Mobilgeräten unter der App ein weißer Streifen
       stehen — die Adressleiste blendet sich beim Scrollen aus bzw. die
       Bildschirmtastatur verkleinert die Ansicht, und die Flutter-Fläche
       wuchs danach nicht wieder mit. `100dvh` folgt genau dieser
       dynamischen Höhe; `100vh` bleibt als Rückfall für ältere Browser.
       Die Hintergrundfarbe entspricht dem App-Hintergrund, damit selbst
       ein Rest-Spalt nicht weiß aufblitzt. */
    html, body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #F3F6F7;
      overscroll-behavior: none;
    }

    flutter-view, flt-glass-pane {
      height: 100%;
    }

    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: #F3F6F7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #app-loading img { width: 64px; height: 64px; object-fit: contain; }
    #app-loading .sp {
      width: 34px; height: 34px; border: 3px solid #dbe3e3; border-top-color: #00B287;
      border-radius: 50%; animation: codriver-spin .8s linear infinite;
    }
    #app-loading .tx { color: #6B7280; font-size: 14px; font-weight: 600; letter-spacing: .01em; }
    @keyframes codriver-spin { to { transform: rotate(360deg); } }

    /* On-demand overlay for the Shift Plan Excel upload. CSS animations run
       on the compositor thread, so this spinner keeps moving even while the
       Dart main isolate is blocked by the synchronous workbook decode. */
    #xlsx-loader {
      position: fixed; inset: 0; z-index: 2147483647; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #xlsx-loader .box {
      background: #fff; border-radius: 22px; padding: 34px 46px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.22);
      display: flex; flex-direction: column; align-items: center; min-width: 300px;
    }
    #xlsx-loader .sp2 {
      width: 56px; height: 56px; border: 5px solid #d6efe7; border-top-color: #00B287;
      border-radius: 50%; animation: codriver-spin .8s linear infinite;
    }
    #xlsx-loader .t { margin-top: 24px; font-size: 19px; font-weight: 800; color: #0f172a; }
    #xlsx-loader .m { margin-top: 6px; font-size: 14px; color: #64748b; }
    #xlsx-loader .dots { margin-top: 14px; display: flex; gap: 7px; }
    #xlsx-loader .dots i {
      width: 8px; height: 8px; border-radius: 50%; background: #00B287; display: block;
      animation: xlsx-bounce 1.2s infinite ease-in-out;
    }
    #xlsx-loader .dots i:nth-child(2) { animation-delay: .18s; }
    #xlsx-loader .dots i:nth-child(3) { animation-delay: .36s; }
    @keyframes xlsx-bounce { 0%,80%,100% { opacity: .3; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="app-loading">
    <img src="codriver-mark.png" alt="CoDriver" />
    <div class="sp"></div>
    <div class="tx">CoDriver wird geladen …</div>
  </div>

  <div id="xlsx-loader">
    <div class="box">
      <div class="sp2"></div>
      <div class="t" id="xlsx-loader-title">Shift plan loading</div>
      <div class="m" id="xlsx-loader-msg">Datei wird verarbeitet …</div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
  </div>
  <script>
    window.cdShowXlsxLoader = function (msg, title) {
      var e = document.getElementById('xlsx-loader');
      if (!e) return;
      if (msg) { var m = document.getElementById('xlsx-loader-msg'); if (m) m.textContent = msg; }
      if (title) { var t = document.getElementById('xlsx-loader-title'); if (t) t.textContent = title; }
      e.style.display = 'flex';
    };
    window.cdSetXlsxLoaderMsg = function (msg) {
      var m = document.getElementById('xlsx-loader-msg');
      if (m && msg) m.textContent = msg;
    };
    window.cdHideXlsxLoader = function () {
      var e = document.getElementById('xlsx-loader');
      if (e) e.style.display = 'none';
    };
  </script>
  <script>
    // Branded loading screen entfernen, sobald Flutter den ersten Frame
    // rendert (sonst sähe der Nutzer waehrend des Downloads nur Weiss).
    (function () {
      function hide() {
        var el = document.getElementById('app-loading');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 400);
      }
      window.addEventListener('flutter-first-frame', hide);
      // Fallback, falls das Event nicht feuert.
      setTimeout(hide, 25000);
    })();
  </script>
  <script>
    // Mobile Ansichtshöhe nachziehen.
    //
    // Schliesst sich auf dem Handy die Bildschirmtastatur oder blendet die
    // Adressleiste wieder ein, feuert Flutter nicht immer ein eigenes
    // Resize — die App blieb dann auf der kleineren Höhe stehen und unter
    // ihr klaffte ein weisser Bereich (gemeldet aus dem Feedback-Bereich).
    // `visualViewport` meldet genau diese Aenderung; wir reichen sie als
    // gewoehnliches resize-Event weiter, worauf Flutter neu misst.
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var pending = false;
      function fire() {
        window.dispatchEvent(new Event('resize'));
      }
      function nudge() {
        if (pending) return;
        pending = true;
        requestAnimationFrame(function () {
          pending = false;
          fire();
          // Android-Tastaturen animieren: ein einzelner Frame trifft die
          // Zwischenhoehe, der Canvas blieb dann klein (halbes Bild leer).
          // Zwei Nachzuegler treffen die Endgeometrie zuverlaessig.
          setTimeout(fire, 250);
          setTimeout(fire, 600);
        });
      }
      vv.addEventListener('resize', nudge);
      vv.addEventListener('scroll', nudge);
      vv.addEventListener('scroll', nudge);
    })();
  </script>
  <script>
    // Kein Service Worker (Build mit --pwa-strategy=none). Bestehende SWs
    // und Caches früherer Versionen sofort entfernen, damit neue Deploys
    // ohne Hard-Refresh sichtbar werden.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (const registration of registrations) {
          registration.unregister();
        }
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
